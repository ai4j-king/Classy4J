server.port=8080
application.name=springai-deepseek4j-gchain4j

# H2数据库配置
spring.datasource.url=jdbc:h2:file:./data/testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2控制台配置
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA配置
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

deepseek.connect-timeout=300
deepseek.read-timeout=600
deepseek.call-timeout=600

#remote deepseek_server invoke
deepseek.base_url=https://api.deepseek.com/v1
deepseek.api_key=your api key
deepseek.model=deepseek-chat

langchain4j.openai.chat-model.api-key=your api key
langchain4j.openai.chat-model.model-name=deepseek-chat
langchain4j.openai.chat-model.base-url=https://api.deepseek.com/v1
